---
name: Test

"on":
  pull_request:
  push:

permissions:
  contents: read

jobs:
  lint-unit:
    uses: test-kitchen/.github/.github/workflows/lint-unit.yml@main

  smoke-config:
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: Gemfile.smoke
      BUNDLE_WITHOUT: development
      SCW_SECRET_KEY: offline-smoke-placeholder
      SCW_DEFAULT_PROJECT_ID: offline-smoke-placeholder
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Load all three smoke suites
        run: |
          export BUNDLE_GEMFILE="$PWD/Gemfile.smoke"
          actual=$(bundle exec ruby examples/apache2/run.rb list --bare | sort)
          expected=$(printf '%s\n' ansible-ubuntu-24 cinc-ubuntu-24 puppet-ubuntu-24)
          test "$actual" = "$expected"
